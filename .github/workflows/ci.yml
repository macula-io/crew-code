name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and its marketplace
        run: claude plugin validate .
      - name: Run the plugin's tests
        run: claude plugin test .
      - name: Check the launcher's shell syntax
        run: bash -n bin/crew
      - name: Run the OpenCode adapter's tests
        # macula.node-test.ts is the #23 integration test: it skips unless an OpenCode 2 binary is on PATH (CI has
        # none: v2 is not on npm and anomalyco/opencode's public releases stop at v1.18.35). It runs on a workstation.
        run: node --experimental-strip-types --test hosts/opencode/beat.node-test.ts hosts/opencode/room.node-test.ts hosts/opencode/launcher.node-test.ts hosts/opencode/server.node-test.ts hosts/opencode/macula.node-test.ts
